version: '4.59.0'

services:
  web:
    build: . 
    container_name: lms_web
    restart: always
    ports:
      - "8000:80" 
    volumes:
      - ./src:/var/www/html # Chỉ mount thư mục src vào web server
    depends_on:
      - db

  db:
    image: mariadb:10.6.4
    container_name: lms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lms_phpmyadmin
    restart: always
    ports:
      - "8080:80" 
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: